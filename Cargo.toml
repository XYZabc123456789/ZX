[workspace]
members = [
    "ZX",
    "main_compiler"
]
resolver = "3"

[workspace.dependencies]
main_compiler = { path = "main_compiler" }
enum_dispatch = "0.3.13"
serde = "1.0.229"
slotmap = "1.1.1"
variadics = "0.1.0"
inkwell = "0.10.0"
llvm-sys = "221.1.0"

[profile.release]
codegen-units = 1
lto = true
